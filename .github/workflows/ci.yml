name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev --frozen || uv sync --dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
