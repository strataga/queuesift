[project]
name = "queuesift"
version = "0.1.0"
description = "QueueSift — measured first-pass triage for GitHub Issues"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typesafe-sdk==0.7.5",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
queuesift = "app.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
