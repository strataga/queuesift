services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: queuesift
      POSTGRES_PASSWORD: queuesift-local-only
      POSTGRES_DB: queuesift
    ports:
      - "5432:5432"
    volumes:
      - queuesift-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesift -d queuesift"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://queuesift:queuesift-local-only@db:5432/queuesift
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  queuesift-db:
